<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theo dõi Hậu phẫu Tim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
/* Layout: bảng điều khiển hồi sức — danh sách BN bên trái, vùng làm việc theo tab bên phải; số liệu canh cột như bảng theo dõi giấy */
.savebar{position:sticky;top:0;z-index:6;display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:8px 0;margin:-4px 0 4px;background:var(--panel);border-bottom:1px solid var(--line)}
.savebar .hint{flex:1;min-width:160px}
:root{
  --bg:#EDF1F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --ink:#13202E; --muted:#5A6A7A; --line:#D3DCE4;
  --accent:#1F4E79; --accent-2:#2C6AA0; --accent-soft:#E2EBF4; --on-accent:#FFFFFF;
  --crit:#C0392B; --crit-soft:#FBE8E6; --warn:#A86A12; --warn-soft:#FCF1DA; --ok:#2C7A57; --ok-soft:#E1F2E8;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#7F7F7F; --paper-head:#1F4E79; --paper-alt:#DCE6F1; --paper-lab:#E2EFD9; --paper-note:#FFF2CC; --paper-risk:#FDEDEC;
  --f-ui:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --f-doc:"Times New Roman", Times, serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --panel:#15202B; --panel-2:#1A2733; --ink:#E3E9EF; --muted:#93A4B4; --line:#2A3947;
  --accent:#86B5E0; --accent-2:#A3C7EA; --accent-soft:#1B2E41; --on-accent:#0D141B;
  --crit:#F08B7F; --crit-soft:#3B201D; --warn:#E6B65E; --warn-soft:#382D16; --ok:#6DC79C; --ok-soft:#163325;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141B; --panel:#15202B; --panel-2:#1A2733; --ink:#E3E9EF; --muted:#93A4B4; --line:#2A3947;
  --accent:#86B5E0; --accent-2:#A3C7EA; --accent-soft:#1B2E41; --on-accent:#0D141B;
  --crit:#F08B7F; --crit-soft:#3B201D; --warn:#E6B65E; --warn-soft:#382D16; --ok:#6DC79C; --ok-soft:#163325;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 auto 12px;max-width:1440px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.top .sp{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.local i{background:var(--warn)} .sync.err i{background:var(--crit)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;max-width:1440px;margin:0 auto}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}

/* sidebar */
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;align-self:start;position:sticky;top:max(10px,env(safe-area-inset-top,0px))}
@media (max-width:860px){.side{position:static}}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.side-h h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.flt{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.flt button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 9px;font-size:12px;color:var(--muted)}
.flt button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.plist{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow:auto}
@media (max-width:860px){.plist{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px}}
.pitem{text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:8px 10px;display:grid;gap:2px;min-width:0}
@media (max-width:860px){.pitem{min-width:200px;border-color:var(--line)}}
.pitem:hover{background:var(--panel-2)}
.pitem.on{background:var(--accent-soft);border-color:var(--accent-soft)}
.pitem b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem span{font-size:12px;color:var(--muted)}
.empty-side{color:var(--muted);font-size:13px;padding:8px}

/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pt-head{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
@media (max-width:640px){.pt-head{grid-template-columns:minmax(0,1fr)}}
.pt-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.pt-meta{color:var(--muted);font-size:13px;margin-top:2px}
.pt-op{margin-top:6px;font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;min-width:110px;background:var(--panel-2)}
.kpi small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi b{font-size:15px;font-weight:600}
.kpi.crit{background:var(--crit-soft);border-color:transparent} .kpi.crit b{color:var(--crit)}
.kpi.warn{background:var(--warn-soft);border-color:transparent} .kpi.warn b{color:var(--warn)}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.phase.slow{background:var(--ok-soft);color:var(--ok)}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-body{padding:14px 16px}

.banner{padding:8px 12px;border-radius:var(--r);font-size:13px}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.info{background:var(--accent-soft)}
.banner.crit{background:var(--crit-soft)}

/* trends */
.trends{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.spark{flex:none;width:172px;border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--panel-2)}
.spark small{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.spark b{font-size:15px}
.spark svg{display:block;width:100%;height:38px}

/* observation */
.obs{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:14px}
@media (max-width:1000px){.obs{grid-template-columns:minmax(0,1fr)}}
.tl-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.tl-daysel{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}.tl-daysel select{height:32px;padding:2px 8px;font-size:13px;width:auto}
.tl{border:1px solid var(--line);border-radius:var(--r);max-height:640px;overflow:auto;background:var(--panel)}
@media (max-width:1000px){.tl{max-height:340px}}
.tl-day{position:sticky;top:0;background:var(--panel-2);padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;z-index:1}
.tl-row{display:grid;grid-template-columns:14px 52px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 10px}
.tl-row:hover{background:var(--panel-2)}
.tl-row.on{background:var(--accent-soft)}
.tl-row .t{font-weight:600}
.tl-row .v{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:transparent}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.due{border-color:var(--accent-2);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.dot.late{border-color:var(--warn);background:var(--warn-soft)}
.dot.up{border-style:dashed}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.late{background:var(--warn-soft);color:var(--warn)}
.badge.due{background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.bdg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.badge.extra{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}

.form{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.form-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.form-h h3{font-size:16px;font-weight:700}
.form-h .sub{color:var(--muted);font-size:12px}
.form-h .sp{flex:1}
.fsec{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:560px){.fsec{grid-template-columns:minmax(0,1fr)}}
.fsec>label,.fsec>.lbl{font-weight:600;font-size:13px;padding-top:6px}
.fsec:last-child{border-bottom:0}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:6px 8px;min-width:0}
.fld input:focus,.fld textarea:focus,.inp:focus{border-color:var(--accent-2);outline:none;background:var(--panel)}
.fld input.n{width:84px;font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.fld input.n.w{width:110px}
.fld .u{font-size:11px;color:var(--muted)}
.fld input.warn{border-color:var(--warn);background:var(--warn-soft)}
.fld input.crit{border-color:var(--crit);background:var(--crit-soft);color:var(--crit);font-weight:600}
.fld.grow{flex:1 1 220px}
.fld.grow input,.fld.grow textarea{width:100%}
textarea{resize:vertical;min-height:38px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.khacw .khac{height:30px;width:220px;max-width:100%;padding:2px 10px;font-size:13px;border-radius:99px}
.fsec select.mau{max-width:100%;width:100%;height:34px;font-size:13px;color:var(--accent);font-weight:600}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:13px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.calc{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;background:var(--accent-soft);font-weight:600}
.flags{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.flags:empty{display:none}
.flag{font-size:13px;padding:5px 10px;border-radius:6px}
.flag.crit{background:var(--crit-soft);color:var(--crit);font-weight:600}
.flag.warn{background:var(--warn-soft)}
.form-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--panel-2);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.form-f .sp{flex:1}
.saved{font-size:12px;color:var(--muted)}

/* info grid */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 14px}
.igrid .wide{grid-column:1/-1}
.igrid .fld input,.igrid .fld select,.igrid .fld textarea{width:100%}
.sect-t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sect-t:first-child{margin-top:0}
.hint{font-size:12px;color:var(--muted)}

/* labs */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.lab{border-collapse:collapse;min-width:100%;font-size:13px}
table.lab th,table.lab td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.lab th{background:var(--panel-2);font-weight:600;padding:6px 8px;text-align:center;white-space:nowrap;font-size:12px}
table.lab th:first-child,table.lab td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;padding:6px 10px;white-space:nowrap;font-weight:600}
table.lab th:first-child{background:var(--panel-2)}
table.lab td input{width:78px;border:0;background:transparent;padding:6px 8px;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.lab td input.txt{width:140px;text-align:left;font-family:var(--f-ui)}
table.lab td input.note{width:200px;text-align:left;font-family:var(--f-ui)}
table.lab td input:focus{background:var(--accent-soft);outline:none}
table.lab td input.hi,table.lab td input.lo{color:var(--crit);font-weight:600}
table.lab td.ref{font-size:11px;color:var(--muted);padding:4px 8px;white-space:nowrap}
table.lab th .x{border:0;background:transparent;color:var(--muted);padding:0 0 0 4px}
.lab-add{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:10px}

/* report preview */
.rep-opts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:12px}
.paper-wrap{overflow-x:hidden;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--f-doc);font-size:13px;width:780px;margin:0 auto;padding:36px 44px;box-shadow:0 1px 4px rgba(0,0,0,.15);line-height:1.3}
.paper table{border-collapse:collapse;width:100%}
.paper .hd td{border:0;text-align:center;font-weight:700;color:var(--paper-head);vertical-align:top}
.paper .hd td small{display:block;font-weight:400;color:var(--paper-ink)}
.paper .ttl{text-align:center;color:var(--paper-head);font-size:21px;font-weight:700;margin:14px 0 2px}
.paper .stl{text-align:center;font-style:italic;color:#595959;font-size:12px;margin-bottom:10px}
.paper .sec{background:var(--paper-head);color:#fff;font-weight:700;padding:2px 6px;margin:12px 0 6px;font-size:14px}
.paper .grid td,.paper .grid th{border:1px solid var(--paper-line);padding:3px 5px;vertical-align:middle}
.paper .grid th{background:var(--paper-head);color:#fff;font-size:12px}
.paper .grid td.l{font-weight:700;width:96px}
.paper .grid tr.a td{background:var(--paper-alt)}
.paper .grid.labt tr.a td{background:var(--paper-lab)}
.paper .grid td.nt{background:var(--paper-note)!important}
.paper .grid td{font-size:12px}
.paper .red{color:#C00000;font-weight:700}
.paper .grp{text-align:center;font-weight:700;margin:10px 0 4px}
.paper p{margin:3px 0}
.paper .risk{background:var(--paper-risk);border:1px solid var(--paper-line);padding:6px 10px;margin-top:12px}
.paper .risk b{color:#C0392B}
.paper .sig td{border:0;text-align:center;padding-top:14px}
.paper .sig i{display:block;font-size:12px}
.paper .sig .nm{margin-top:48px;font-weight:700}

/* settings */
table.th{border-collapse:collapse;font-size:13px}
table.th th,table.th td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
table.th input{width:70px;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:4px 6px;text-align:right;font-family:var(--f-num)}

/* empty / modal */
.empty{padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-size:20px}
.empty p{color:var(--muted);max-width:52ch;margin:0}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:12px;border:1px solid var(--line);max-width:440px;width:100%;padding:18px;display:grid;gap:12px}
.modal h3{font-size:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
/* ô ngày giờ 24h */
.dt{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.dt input[type=date]{flex:1 1 140px;min-width:0}
.dt select{width:auto!important;font-family:var(--f-num)}
.dt .colon{font-weight:700}
.who{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.rb{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.rb.admin{background:var(--accent);color:var(--on-accent)}.rb.nhap{background:var(--ok-soft);color:var(--ok)}.rb.xem{background:var(--warn-soft);color:var(--warn)}
.ord{border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;background:var(--panel);overflow:hidden}
.ord.xong{opacity:.75}
.ord-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.ord-h .sub{font-size:12px;color:var(--muted);margin-top:2px}
.ord-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.slots .tl-row{grid-template-columns:14px 92px minmax(0,1fr) auto}
.slots .tl-row .v{white-space:normal}
.ftot{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:4px}
.ftot>div{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:8px 10px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font-size:13px}
.ftot small{flex-basis:100%;font-size:12px;font-weight:600;color:var(--muted)}
.ftot b.neg{color:var(--warn)}.ftot b.pos{color:var(--accent)}
.fsec .ftot-wrap{grid-column:2}
@media (max-width:560px){.fsec .ftot-wrap{grid-column:1}}
.paper p.tot{background:#E2EFD9;color:#1F4E79;padding:3px 6px;margin:0 0 10px;font-size:12px}
.vsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.vsw button{border:0;background:var(--panel);padding:7px 14px;font-weight:500;color:var(--muted)}
.vsw button.on{background:var(--accent);color:var(--on-accent);font-weight:600}

<script>
/* ============ HẰNG SỐ ============ */
const MAU_DEF=['Tỉnh, tiếp xúc tốt','An thần, thở máy theo chỉ định','Da niêm hồng, chi ấm','Thở đều, không co kéo','Phổi thông khí đều hai bên','Mạch, huyết áp ổn định','Không sốt','Không đau ngực','Đau vết mổ ít','Vết mổ khô, không thấm dịch','Dẫn lưu ra ít, dịch hồng loãng','Dẫn lưu không ra thêm','Tiểu tốt, nước tiểu vàng trong','Bụng mềm, không chướng','Đã rút nội khí quản, thở oxy kính','Ăn uống được qua đường miệng','Vận động nhẹ tại giường','Đã báo bác sĩ trực'].join('\n');
function mauCau(){return String(S.cfg&&S.cfg.mauCau!=null&&String(S.cfg.mauCau).trim()?S.cfg.mauCau:MAU_DEF).split('\n').map(x=>x.trim()).filter(Boolean)}
const OBS_FIELDS=['ythuc','lamsang','hohap','nt','spo2','fio2','m','hatt','hatr','cvp','vanmach','t','nuoctieu','danluu','tinhchat','vao','ra','cannang','dh','khac'];
const YTHUC=['An thần, chưa tỉnh','Tỉnh, tiếp xúc tốt','Lơ mơ','Kích thích, vật vã'];
const HOHAP=['Thở máy','Oxy mask','Oxy kính','HFNC','Thở khí trời'];
const TINHCHAT=['Máu đỏ tươi','Máu/dịch đỏ','Dịch hồng','Dịch vàng trong'];
const SUG={
 ythuc:['Tỉnh, tiếp xúc chậm','Tỉnh, kích thích nhẹ','Ngủ, gọi tỉnh','Mê, GCS ≤ 8','An thần sâu (RASS −4)','An thần nhẹ (RASS −1)','Co giật','Mê sảng (delirium)'],
 hohap:['Thở máy SIMV','Thở máy PSV','Thở máy CPAP','Thở BiPAP','Oxy 2 l/ph','Oxy 3 l/ph','Oxy 5 l/ph','HFNC 40 l/ph FiO₂ 40%','Thở oxy qua ống chữ T','Vừa rút NKQ'],
 tinhchat:['Dịch hồng loãng','Dịch thanh dịch','Máu cục','Không ra dịch','Dịch đục','Có khí theo dẫn lưu'],
 vanmach:['Không dùng vận mạch','Noradrenalin 0,05 µg/kg/ph','Noradrenalin 0,1 µg/kg/ph','Noradrenalin 0,2 µg/kg/ph','Adrenalin 0,05 µg/kg/ph','Adrenalin 0,1 µg/kg/ph','Dobutamin 3 µg/kg/ph','Dobutamin 5 µg/kg/ph','Dopamin 5 µg/kg/ph','Milrinon 0,375 µg/kg/ph','Levosimendan 0,1 µg/kg/ph','Nitroglycerin 0,5 µg/kg/ph','Đang giảm liều vận mạch','Đã ngưng vận mạch'],
 khac:['Kali truyền 10 mmol/giờ','Insulin truyền 2 UI/giờ','Lactat máu','Điểm đau VAS 3','Máy tạo nhịp tạm thời 80 l/ph','Nhịp xoang','Rung nhĩ','Ngoại tâm thu thất','Đã truyền máu','Đã truyền huyết tương tươi','Furosemid tiêm tĩnh mạch','Đã chụp X-quang ngực','Đã làm khí máu','Đã báo bác sĩ trực']};
function sugList(f,exclude=[]){const used=Object.values(S.obs||{}).map(o=>o&&o[f]).filter(v=>has(v)).flatMap(v=>String(v).split(/\s*;\s*/)).map(x=>x.trim()).filter(x=>x&&x.length<80);const out=[];[...(SUG[f]||[]),...used].forEach(x=>{if(!exclude.includes(x)&&!out.includes(x))out.push(x)});return out}
function dlHtml(id,list){return `<datalist id="${id}">${list.map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`}
const ANALYTES=[
  {k:'bc',l:'BC (G/L)',lo:4,hi:10},{k:'neut',l:'Neut (%)',lo:40,hi:75},{k:'rbc',l:'RBC (T/L)',lo:3.8,hi:5.5},
  {k:'hb',l:'Hb (g/L)',lo:120,hi:170},{k:'hct',l:'Hct (%)',lo:36,hi:50},{k:'tc',l:'TC (G/L)',lo:150,hi:400},
  {k:'crp',l:'CRP',lo:null,hi:null},{k:'ure',l:'Ure (mmol/L)',lo:2.5,hi:7.5},{k:'cre',l:'Cre (µmol/L)',lo:53,hi:120},
  {k:'got',l:'GOT (U/L)',lo:null,hi:40},{k:'gpt',l:'GPT (U/L)',lo:null,hi:40},{k:'ggt',l:'GGT (U/L)',lo:null,hi:60},
  {k:'pt',l:'PT (%)',lo:70,hi:140},{k:'aptt',l:'aPTT (giây)',lo:26,hi:40},{k:'inr',l:'INR',lo:0.8,hi:1.2},
  {k:'lac',l:'Lactate (mmol/L)',lo:null,hi:2},{k:'na',l:'Na⁺ (mmol/L)',lo:135,hi:145},{k:'k',l:'K⁺ (mmol/L)',lo:3.5,hi:5},
  {k:'glu',l:'Glu (mmol/L)',lo:3.9,hi:6.4},
  {k:'khimau',l:'Khí máu',text:true},{k:'mentim',l:'Men tim',text:true},{k:'ecg',l:'ECG',text:true},{k:'sieuam',l:'Siêu âm tim',text:true}
];
const TH_DEF={
  spo2:{l:'SpO₂ (%)',cl:90,wl:94},
  nt:{l:'Nhịp thở (l/ph)',cl:8,wl:10,wh:24,ch:30},
  m:{l:'Mạch (l/ph)',cl:45,wl:55,wh:110,ch:130},
  hatt:{l:'HA tâm thu (mmHg)',cl:80,wl:90,wh:160,ch:180},
  t:{l:'Nhiệt độ (°C)',cl:35,wl:35.5,wh:38.5,ch:39},
  nuoctieu:{l:'Nước tiểu (ml/kg/giờ)',cl:0.3,wl:0.5},
  danluu:{l:'Dẫn lưu (ml/giờ)',wh:100,ch:200},
  dh:{l:'Đường huyết (mmol/L)',cl:3,wl:4,wh:10,ch:14}
};
const DEFAULT_STAFF=[{id:'u_admin',ten:'Quản trị khoa',chucDanh:'Trưởng khoa / ĐD trưởng',role:'admin',pin:''},
  {id:'u_van',ten:'Lê Thị Thúy Vân',chucDanh:'',role:'nhap',pin:''},{id:'u_nhieu',ten:'Hồ Thái Nhiều',chucDanh:'',role:'nhap',pin:''},
  {id:'u_hang',ten:'Trương Thị Thu Hằng',chucDanh:'',role:'nhap',pin:''},{id:'u_chien',ten:'Phạm Thị Chiến',chucDanh:'',role:'nhap',pin:''}];
const CFG_DEF={plan:[1],planRest:3,donviTren:'BỆNH VIỆN THỐNG NHẤT',donviTren2:'TP. HỒ CHÍ MINH',donviPhai:'BỆNH VIỆN ĐKTT GIA LAI',donviPhai2:'',th:TH_DEF};

/* ============ TIỆN ÍCH ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const num=v=>{if(v===undefined||v===null||v==='')return NaN;const x=parseFloat(String(v).replace(',','.'));return x};
const has=v=>v!==undefined&&v!==null&&String(v).trim()!=='';
const toKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fromKey=k=>new Date(k);
const docId=(p,k)=>p+k.replace(/\D/g,'');
const hLabel=k=>{const d=fromKey(k);return `${d.getHours()}h${d.getMinutes()?pad(d.getMinutes()):''} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const hhmm=k=>{const d=fromKey(k);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dmy=s=>{if(!s)return '';const d=new Date(s.length<=10?s+'T00:00':s);if(isNaN(d))return s;return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtN=x=>isNaN(x)?'':(Math.round(x*10)/10).toLocaleString('vi-VN');
const signed=x=>isNaN(x)?'':(x>0?'+':'')+fmtN(x);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function noAccent(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')}

/* ô nhập ngày + giờ 24 giờ (không hiện SA/CH) */
function dtHtml(id,val,attr=''){
  const d=val?val.slice(0,10):'',h=val?val.slice(11,13):'',m=val?val.slice(14,16):'00';
  const mins=[...Array(12)].map((_,i)=>pad(i*5));if(m&&!mins.includes(m))mins.push(m),mins.sort();
  return `<span class="dt" ${attr}><input type="date" class="inp" id="${id}_d" value="${d}" aria-label="Ngày">`+
   `<select class="inp" id="${id}_h" aria-label="Giờ (0–23)">${[...Array(24)].map((_,i)=>`<option value="${pad(i)}" ${pad(i)===h?'selected':''}>${pad(i)}</option>`).join('')}</select><span class="colon">:</span>`+
   `<select class="inp" id="${id}_m" aria-label="Phút">${mins.map(x=>`<option ${x===m?'selected':''}>${x}</option>`).join('')}</select><span class="hint">(24 giờ)</span></span>`}
function dtVal(id,root=document){const d=root.querySelector('#'+id+'_d');if(!d||!d.value)return '';return `${d.value}T${root.querySelector('#'+id+'_h').value}:${root.querySelector('#'+id+'_m').value}`}

/* ============ TRẠNG THÁI ============ */
const S={orders:{},mode:'pending',shareRo:false,login:null,patients:{},cur:null,obs:{},labs:{},tab:'theodoi',sel:null,filter:'dang',cfg:JSON.parse(JSON.stringify(CFG_DEF)),
  me:lsGet('hpt-me',''),rep:{only:true,step:1,from:'',to:''},showUp:false};
let store=null, unwatch=null;

/* ============ NGƯỜI DÙNG & PHÂN QUYỀN ============ */
const ROLES={admin:'Quản trị',nhap:'Nhập liệu',xem:'Chỉ xem'};
S.login=(()=>{const L=lsGet('hpt-login',null);return L&&Date.now()-L.at<12*36e5?L:null})();
function staffList(){return Array.isArray(S.cfg.staff)?S.cfg.staff:[]}
function curUser(){const L=S.login;if(!L)return null;if(Date.now()-L.at>12*36e5){S.login=null;lsSet('hpt-login',null);return null}return staffList().find(x=>x.id===L.id)||null}
function adminExists(){return staffList().some(x=>x.role==='admin')||S.mode==='db'}
function role(){const u=curUser();if(u)return S.isOwner&&u.role!=='admin'?'admin':u.role;if(S.isOwner)return 'admin';if(S.mode!=='fb'&&(!staffList().length||!adminExists()))return 'open';return 'xem'}
function actorId(){const u=curUser();return u?u.id:(S.isOwner?'owner':'')}
function actorName(){const u=curUser();return u?u.ten:(S.me||(S.isOwner?'Quản trị':''))}
/* người nào ghi thì người đó sửa (Quản trị sửa được tất cả) */
function canEditRec(byId){if(S.ro)return false;if(canAdmin())return true;if(!byId)return true;return byId===actorId()}
Object.defineProperty(S,'ro',{get(){return S.shareRo||!['open','admin','nhap'].includes(role())}});
function canAdmin(){return !S.shareRo&&['open','admin'].includes(role())}
async function hashPin(pin){const str='hpt|'+pin;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of str)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+(h>>>0).toString(16)}}
function renderWho(){const el=$('#who');if(!el)return;const r=role(),u=curUser();
  if(S.shareRo){el.innerHTML='<span class="who"><span class="rb xem">Chỉ xem</span></span>';const bn=$('#btnNew');if(bn)bn.hidden=true;const bi=$('#btnImp');if(bi)bi.hidden=true;return}
  if(r==='open'){el.innerHTML='';}
  else if(!u&&S.isOwner)el.innerHTML=`<span class="who"><b>${esc(S.me||'Chủ sở hữu')}</b><span class="rb admin">Quản trị</span></span>`;
  else if(u)el.innerHTML=`<span class="who"><b>${esc(u.ten)}</b><span class="rb ${u.role}">${ROLES[u.role]}</span><button class="btn sm ghost" data-act="mypin">Đổi PIN</button><button class="btn sm ghost" data-act="logout">Đăng xuất</button></span>`;
  else el.innerHTML=`<span class="who"><span class="rb xem">Đang chỉ xem</span><button class="btn sm pri" data-act="login">Đăng nhập ca</button></span>`;
  const bn=$('#btnNew');if(bn)bn.hidden=S.ro;const bi=$('#btnImp');if(bi)bi.hidden=!canAdmin();const bq=$('#btnQuick');if(bq)bq.hidden=S.ro;}
function needLogin(){if(S.shareRo){toast('Tài khoản chỉ có quyền xem trên link chia sẻ');return}if(!curUser())loginModal();else toast('Tài khoản của anh/chị chỉ có quyền xem')}
function loginModal(){const st=staffList().slice().sort((a,b)=>a.ten.localeCompare(b.ten,'vi'));
  modal(`<h3>Đăng nhập ca trực</h3><label class="fld"><span>Người dùng</span><select class="inp" id="lg_u">${st.map(x=>`<option value="${x.id}">${esc(x.ten)}${x.chucDanh?' – '+esc(x.chucDanh):''} (${ROLES[x.role]})</option>`).join('')}</select></label>
   <p class="hint" id="lg_first" style="margin:0" hidden>Lần đầu đăng nhập: tự đặt mã PIN 4–6 chữ số và ghi nhớ. Chỉ mình anh/chị biết mã này.</p>
   <label class="fld"><span id="lg_pl">Mã PIN</span><input class="inp" id="lg_p" type="password" inputmode="numeric" autocomplete="off" maxlength="6"></label>
   <label class="fld" id="lg_p2w" hidden><span>Nhập lại mã PIN</span><input class="inp" id="lg_p2" type="password" inputmode="numeric" autocomplete="off" maxlength="6"></label>
   <p class="hint" style="margin:0">Phiên đăng nhập tự hết hạn sau 12 giờ hoặc khi bấm Đăng xuất.</p>
   <div class="acts"><button class="btn" data-m="cancel">Huỷ</button><button class="btn pri" data-m="ok">Đăng nhập</button></div>`,async r=>{
    const id=r.querySelector('#lg_u').value,pin=r.querySelector('#lg_p').value.trim();const u=staffList().find(x=>x.id===id);
    if(u&&!u.pin){const p2=r.querySelector('#lg_p2').value.trim();if(!/^\d{4,6}$/.test(pin)){toast('Mã PIN gồm 4–6 chữ số');return false}if(pin!==p2){toast('Hai lần nhập PIN không khớp');return false}
      const h=await hashPin(pin);S.cfg={...S.cfg,staff:staffList().map(x=>x.id===u.id?{...x,pin:h}:x)};later('cfg',()=>store.saveCfg(S.cfg),50)}
    else if(!u||!pin||await hashPin(pin)!==u.pin){toast('Mã PIN không đúng');r.querySelector('#lg_p').value='';r.querySelector('#lg_p').focus();return false}
    S.login={id,at:Date.now()};lsSet('hpt-login',S.login);S.me=u.ten;lsSet('hpt-me',S.me);renderAll();toast('Xin chào '+u.ten+' – quyền '+ROLES[u.role])});
  const sel=document.querySelector('#lg_u');const sync=()=>{const u=staffList().find(x=>x.id===sel.value);const first=u&&!u.pin;document.querySelector('#lg_first').hidden=!first;document.querySelector('#lg_p2w').hidden=!first;document.querySelector('#lg_pl').textContent=first?'Đặt mã PIN mới':'Mã PIN'};
  sel.onchange=sync;sync();setTimeout(()=>{const p=document.querySelector('#lg_p');if(p)p.focus()},50)}
async function fbQuickModal(){let pq={};try{pq=(await FB.db.ref('phanQuyen').once('value')).val()||{}}catch(e){}
  const ad=[],nh=[],xe=[];for(const[n,p]of Object.entries(pq)){if(!p)continue;if(p.is_admin)ad.push(n);else if(p[FB_PERM_EDIT])nh.push(n);else if(p[FB_PERM_VIEW])xe.push(n)}
  const li=a=>a.length?a.sort((x,y)=>x.localeCompare(y,'vi')).map(esc).join(', '):'<span class="hint">(chưa có)</span>';
  modal(`<h3>Xem nhanh</h3><div><div class="sect-t" style="margin-top:0">Người đang dùng</div>${S.fbUser?`<b>${esc(S.fbUser.name)}</b> <span class="rb ${S.fbUser.role}">${ROLES[S.fbUser.role]}</span>`:'<span class="rb xem">Đang xem – chưa đăng nhập</span>'}</div>
   <div><div class="sect-t">Phân quyền (theo app Kanban)</div><p style="margin:0 0 4px"><span class="rb admin">Quản trị</span> ${li(ad)}</p><p style="margin:0 0 4px"><span class="rb nhap">Nhập liệu</span> ${li(nh)}</p>
   <p class="hint" style="margin:6px 0 0">Ai mở link cũng xem được (không cần đăng nhập). Nhập liệu chỉ sửa mốc do mình ghi; Quản trị sửa được tất cả. Đổi quyền: app Kanban → Phân quyền.</p></div>
   <div><div class="sect-t">Nhập tiếp dữ liệu</div><ol style="margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px"><li>Chọn bệnh nhân ở cột trái → tab <b>Theo dõi lâm sàng</b> → <b>Ghi mốc hiện tại</b> hoặc bấm giờ cần ghi.</li><li>Nhập vào phiếu bên phải; app tự lưu, tự tính dịch ra, bilan.</li><li>Xét nghiệm: tab <b>Xét nghiệm</b>. Chỉ định: tab <b>Chỉ định & báo cáo</b>.</li></ol></div>
   <div class="acts"><button class="btn" data-m="cancel">Đóng</button><button class="btn pri" data-m="ok">Đóng</button></div>`,()=>{})}

/* ============ LƯU TRỮ: db dùng chung, dự phòng localStorage ============ */
function makeLocalStore(){
  let data=lsGet('hpt-data',{patients:{},cfg:null});
  const L={pl:[],pw:{}};
  const persist=()=>lsSet('hpt-data',data);
  const firePl=()=>{const m={};for(const[id,p]of Object.entries(data.patients))m[id]=p.info;L.pl.forEach(f=>f(m))};
  const firePw=pid=>{(L.pw[pid]||[]).forEach(f=>{const p=data.patients[pid];f(p?{info:p.info,obs:{...p.obs},labs:{...p.labs},orders:{...(p.orders||{})}}:null)})};
  return {
    kind:'local',
    listPatients(cb){L.pl.push(cb);setTimeout(firePl);return()=>{L.pl=L.pl.filter(x=>x!==cb)}},
    watchCfg(cb){setTimeout(()=>cb(data.cfg));return()=>{}},
    saveCfg(c){data.cfg=c;persist()},
    watchPatient(pid,cb){(L.pw[pid]=L.pw[pid]||[]).push(cb);setTimeout(()=>firePw(pid));return()=>{L.pw[pid]=L.pw[pid].filter(x=>x!==cb)}},
    saveInfo(pid,info){(data.patients[pid]=data.patients[pid]||{info:{},obs:{},labs:{}}).info=info;persist();firePl()},
    saveObs(pid,k,o){data.patients[pid].obs[k]=o;persist()},
    delObs(pid,k){delete data.patients[pid].obs[k];persist()},
    saveLab(pid,k,o){data.patients[pid].labs[k]=o;persist()},
    delLab(pid,k){delete data.patients[pid].labs[k];persist()},
    saveOrder(pid,id,o){(data.patients[pid].orders=data.patients[pid].orders||{})[id]=o;persist()},
    delOrder(pid,id){if(data.patients[pid].orders)delete data.patients[pid].orders[id];persist()},
    async delPatient(pid){delete data.patients[pid];persist();firePl()},
    async importPatient(pid,p){data.patients[pid]=p;persist();firePl()}
  };
}
function makeDbStore(db){
  const q={},timers={};
  const write=(path,fn)=>{q[path]=(q[path]||Promise.resolve()).then(fn).catch(e=>{
    if(e&&e.code==='invalid_argument'){S.shareRo=true;setSync('err','Chỉ xem — không có quyền ghi');}
    else if(e&&e.code==='quota_exceeded'){toast('Bộ nhớ dữ liệu đã đầy: hãy xoá bớt hồ sơ cũ (đã sao lưu).')}
    else setSync('err','Lỗi lưu, thử lại');
    console.warn(e)})};
  const obsKey=k=>k.replace(/\D/g,'');
  return {
    kind:'db',pending:{},
    listPatients(cb){return db.collection('patients').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());cb(m)},e=>{setSync('err','Mất kết nối dữ liệu')})},
    watchCfg(cb){return db.doc('config/main').onSnapshot(s=>cb(s.exists?s.data():null),()=>{})},
    saveCfg(c){write('config/main',()=>db.doc('config/main').set(c))},
    watchPatient(pid,cb){
      let info=null,obs={},labs={},orders={};const ready=[false,false,false,false];
      const fire=i=>{ready[i]=true;if(ready.every(Boolean))cb({info,obs:{...obs},labs:{...labs},orders:{...orders}})};
      const base=db.doc('patients/'+pid);
      const u1=base.onSnapshot(s=>{info=s.exists?s.data():null;fire(0)},()=>{});
      const u2=base.collection('obs').onSnapshot(s=>{obs={};s.docs.forEach(d=>{const v=d.data();if(v&&v.k)obs[v.k]=v});fire(1)},()=>{});
      const u3=base.collection('labs').onSnapshot(s=>{labs={};s.docs.forEach(d=>{const v=d.data();if(v&&v.k)labs[v.k]=v});fire(2)},()=>{});
      const u4=base.collection('orders').onSnapshot(s=>{orders={};s.docs.forEach(d=>{const v=d.data();if(v&&v.id)orders[v.id]=v});fire(3)},()=>{});
      return()=>{u1();u2();u3();u4()}
    },
    saveInfo(pid,info){const p='patients/'+pid;write(p,()=>db.doc(p).set(info))},
    saveObs(pid,k,o){const p=`patients/${pid}/obs/t${obsKey(k)}`;write(p,()=>db.doc(p).set(o))},
    delObs(pid,k){const p=`patients/${pid}/obs/t${obsKey(k)}`;write(p,()=>db.doc(p).delete())},
    saveLab(pid,k,o){const p=`patients/${pid}/labs/x${obsKey(k)}`;write(p,()=>db.doc(p).set(o))},
    delLab(pid,k){const p=`patients/${pid}/labs/x${obsKey(k)}`;write(p,()=>db.doc(p).delete())},
    saveOrder(pid,id,o){const p=`patients/${pid}/orders/${id}`;write(p,()=>db.doc(p).set(o))},
    delOrder(pid,id){const p=`patients/${pid}/orders/${id}`;write(p,()=>db.doc(p).delete())},
    async delPatient(pid){
      const base=db.doc('patients/'+pid);
      for(const c of['obs','labs','orders']){const s=await base.collection(c).get();for(const d of s.docs){await base.collection(c).doc(d.id).delete()}}
      await base.delete();
    },
    async importPatient(pid,p){
      const base=db.doc('patients/'+pid);await base.set(p.info);
      for(const[k,o]of Object.entries(p.obs||{}))await base.collection('obs').doc('t'+obsKey(k)).set(o);
      for(const[k,o]of Object.entries(p.labs||{}))await base.collection('labs').doc('x'+obsKey(k)).set(o);
      for(const[id,o]of Object.entries(p.orders||{}))await base.collection('orders').doc(id).set(o);
    }
  };
}

function fbClean(x){return JSON.parse(JSON.stringify(x??null))}
function makeFbStore(db){
  const R=p=>db.ref(FB_ROOT+'/'+p);const ok=k=>k.replace(/\D/g,'');
  const fail=e=>{console.warn(e);setSync('err',/permission/i.test(String(e&&e.code||e))?'Firebase chặn ghi – cần mở quyền nút '+FB_ROOT:'Lỗi lưu, kiểm tra mạng')};
  const put=(p,v)=>R(p).set(fbClean(v)).then(()=>setSync('ok','Dữ liệu chung của khoa')).catch(fail);
  const rm=p=>R(p).remove().catch(fail);
  const conn=db.ref('.info/connected');conn.on('value',s=>{if(s.val()===false)setSync('err','Mất kết nối – số liệu sẽ tự gửi khi có mạng');else setSync('ok','Dữ liệu chung của khoa')});
  return {kind:'fb',
    listPatients(cb){const f=s=>cb(s.val()||{});R('info').on('value',f,e=>setSync('err','Không đọc được dữ liệu (quyền Firebase)'));return()=>R('info').off('value',f)},
    watchCfg(cb){const f=s=>cb(s.val());R('config').on('value',f,()=>{});return()=>R('config').off('value',f)},
    saveCfg(c){put('config',c)},
    watchPatient(pid,cb){let info=null,obs={},labs={},orders={};const ready=[0,0,0,0];const fire=i=>{ready[i]=1;if(ready.every(Boolean))cb({info,obs:{...obs},labs:{...labs},orders:{...orders}})};
      const f0=s=>{info=s.val();fire(0)},f1=s=>{obs={};Object.values(s.val()||{}).forEach(v=>{if(v&&v.k)obs[v.k]=v});fire(1)},
        f2=s=>{labs={};Object.values(s.val()||{}).forEach(v=>{if(v&&v.k)labs[v.k]={v:{},...v}});fire(2)},f3=s=>{orders={};Object.values(s.val()||{}).forEach(v=>{if(v&&v.id)orders[v.id]={reports:{},...v}});fire(3)};
      R('info/'+pid).on('value',f0);R('obs/'+pid).on('value',f1);R('labs/'+pid).on('value',f2);R('orders/'+pid).on('value',f3);
      return()=>{R('info/'+pid).off('value',f0);R('obs/'+pid).off('value',f1);R('labs/'+pid).off('value',f2);R('orders/'+pid).off('value',f3)}},
    saveInfo(pid,info){put('info/'+pid,info)},
    saveObs(pid,k,o){put(`obs/${pid}/t${ok(k)}`,o)},delObs(pid,k){rm(`obs/${pid}/t${ok(k)}`)},
    saveLab(pid,k,o){put(`labs/${pid}/x${ok(k)}`,o)},delLab(pid,k){rm(`labs/${pid}/x${ok(k)}`)},
    saveOrder(pid,id,o){put(`orders/${pid}/${id}`,o)},delOrder(pid,id){rm(`orders/${pid}/${id}`)},
    async delPatient(pid){await Promise.all(['obs','labs','orders','info'].map(n=>R(n+'/'+pid).remove()))},
    async importPatient(pid,p){const up={};up['info/'+pid]=fbClean(p.info);for(const[k,o]of Object.entries(p.obs||{}))up[`obs/${pid}/t${ok(k)}`]=fbClean(o);
      for(const[k,o]of Object.entries(p.labs||{}))up[`labs/${pid}/x${ok(k)}`]=fbClean(o);for(const[id,o]of Object.entries(p.orders||{}))up[`orders/${pid}/${id}`]=fbClean(o);
      await db.ref(FB_ROOT).update(up).catch(e=>{fail(e);throw e})}
  };
}

async function fbLogin(){
  const inp=$('#fb_name');const typed=(inp&&inp.value||'').trim();const err=$('#fb_err');const show=t=>{if(err){err.hidden=false;err.textContent=t}};
  const list=S.fbStaff||[];let name=list.find(n=>n===typed)||null;
  if(!name&&typed){const m=list.filter(n=>noAccent(n).toLowerCase().includes(noAccent(typed).toLowerCase()));if(m.length===1)name=m[0];else if(m.length>1){show('Có '+m.length+' người trùng – chọn đúng tên trong danh sách gợi ý');return}}
  if(!name){show('Không tìm thấy tên trong danh sách nhân viên khoa');return}
  let p;try{p=await fbPerm(name)}catch(e){show('Không đọc được phân quyền, kiểm tra mạng');return}
  const normal=()=>{const r=fbRoleOf(p);if(r!=='nhap'){if(!$('#fb_err'))fbLoginModal();setTimeout(()=>{const e=$('#fb_err');if(e){e.hidden=false;e.textContent='“'+name+'” chưa được phân quyền nhập liệu Hậu phẫu tim. Anh/chị vẫn xem được toàn bộ mà không cần đăng nhập; muốn nhập liệu, liên hệ Admin khoa cấp quyền trên app Kanban.'}},60);return}
    fbSetUser({name,role:r,at:Date.now()});toast('Xin chào '+name+' – quyền '+ROLES[r])};
  if(!p.is_admin)return normal();
  let sys='';try{sys=(await FB.db.ref('config/adminPwd').once('value')).val()||''}catch(e){}
  if(!p.adminPass&&!sys){fbSetUser({name,role:'admin',at:Date.now()});toast('Xin chào '+name+' – quyền Quản trị');return}
  modal(`<h3>Mật khẩu Quản lý</h3><p class="hint" style="margin:0">Tài khoản “${esc(name)}” có quyền Admin. Nhập mật khẩu Quản lý (giống app Kanban) để vào quyền Quản trị.</p>
   <label class="fld"><span>Mật khẩu</span><input class="inp" type="password" id="fb_pw" autocomplete="current-password"></label>
   <div class="acts"><button class="btn" data-m="cancel">Vào quyền thường</button><button class="btn pri" data-m="ok">Vào quyền Quản trị</button></div>`,r=>{
    const pw=r.querySelector('#fb_pw').value;if(pw&&(pw===p.adminPass||pw===sys)){fbSetUser({name,role:'admin',at:Date.now()});toast('Xin chào '+name+' – quyền Quản trị');return}
    toast('Sai mật khẩu Quản lý');r.querySelector('#fb_pw').value='';return false});
  const c=document.querySelector('[data-m="cancel"]');if(c)c.onclick=()=>{$('#modalRoot').innerHTML='';normal()};
  setTimeout(()=>{const x=$('#fb_pw');if(x)x.focus()},50);
}

/* ============ ĐỒNG BỘ GOOGLE SHEET (bản chạy ngoài Claude, ví dụ GitHub) ============ */
function syncConf(){const c=lsGet('hpt-sync',null);return c&&c.u&&c.k?c:null}
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return JSON.parse(decodeURIComponent(escape(atob(t))))}
function makeSheetStore(url,key){
  const CK='hpt-sheet-cache';let docs={},ver=0;const c0=lsGet(CK,null);if(c0&&c0.u===url){docs=c0.docs||{};ver=c0.t||0}
  let outbox=lsGet('hpt-outbox',[]);let flushing=false,ftimer=null,lastErr=null;
  const L={pl:[],cfg:[],pw:{}};
  const persist=()=>lsSet(CK,{u:url,docs,t:ver});
  const pats=()=>{const m={};for(const[p,d]of Object.entries(docs)){const a=p.split('/');if(a.length===2&&a[0]==='patients')m[a[1]]=d}return m};
  const pdata=pid=>{const pre='patients/'+pid+'/',out={info:docs['patients/'+pid]||null,obs:{},labs:{},orders:{}};
    for(const[p,d]of Object.entries(docs)){if(!p.startsWith(pre))continue;const a=p.slice(pre.length).split('/');if(a.length!==2||!d)continue;
      if(a[0]==='obs'&&d.k)out.obs[d.k]=d;else if(a[0]==='labs'&&d.k)out.labs[d.k]=d;else if(a[0]==='orders'&&d.id)out.orders[d.id]=d}return out};
  const fireAll=()=>{const m=pats();L.pl.forEach(f=>f(m));L.cfg.forEach(f=>f(docs['config/main']||null));for(const pid of Object.keys(L.pw))L.pw[pid].forEach(f=>f(pdata(pid)))};
  const status=()=>{if(st&&st.ro){setSync('ok','Chỉ xem (dữ liệu chung)');return}if(lastErr)setSync('err',lastErr);else if(outbox.length)setSync('local','Đang gửi '+outbox.length+' thay đổi…');else setSync('ok','Dùng chung (Google Sheet)')};
  async function pull(full){
    const r=await fetch(url+(url.includes('?')?'&':'?')+'key='+encodeURIComponent(key)+'&since='+(full?0:ver),{cache:'no-store'});
    const j=await r.json();if(!j.ok)throw new Error(j.error==='sai_ma'?'Sai mã khoa':'Máy chủ báo lỗi');
    let changed=full;if(full){const keep={};for(const o of outbox)keep[o.path]=docs[o.path];docs={};Object.assign(docs,keep)}
    const pend=new Set(outbox.map(o=>o.path));
    for(const[p,d]of Object.entries(j.docs||{})){if(pend.has(p))continue;if(d===null){if(p in docs){delete docs[p];changed=true}}else if(JSON.stringify(docs[p])!==JSON.stringify(d)){docs[p]=d;changed=true}}
    st.ro=!!j.ro;ver=Math.max(ver,j.t||0);persist();lastErr=null;status();if(changed)fireAll();
  }
  async function flush(){if(flushing||!outbox.length)return;flushing=true;const batch=outbox.slice(0,40);
    try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key,ops:batch})});const j=await r.json();
      if(!j.ok)throw new Error(j.error==='sai_ma'?'Sai mã khoa':'Lỗi ghi');
      outbox=outbox.filter(o=>!batch.includes(o));lsSet('hpt-outbox',outbox);lastErr=null}
    catch(e){lastErr='Chưa gửi được – đang thử lại';setTimeout(flush,15000)}
    finally{flushing=false;status();if(outbox.length&&!lastErr)setTimeout(flush,300)}}
  function queue(op){if(st.ro)return;outbox=outbox.filter(o=>o.path!==op.path);outbox.push(op);lsSet('hpt-outbox',outbox);status();clearTimeout(ftimer);ftimer=setTimeout(flush,600)}
  const set=(p,d)=>{docs[p]=d;persist();queue({op:'set',path:p,data:d})};
  const del=p=>{delete docs[p];persist();queue({op:'del',path:p})};
  const ok=k=>k.replace(/\D/g,'');
  let polling=null;
  var st={kind:'sheet',url,ro:false,
    async init(){await pull(true);polling=setInterval(()=>{if(document.visibilityState==='visible'&&!outbox.length)pull(false).catch(e=>{lastErr='Mất kết nối Google Sheet';status()})},25000);
      window.addEventListener('focus',()=>pull(false).catch(()=>{}));if(outbox.length)flush()},
    pullNow(){return pull(false)},
    has(p){return !!docs[p]},
    listPatients(cb){L.pl.push(cb);setTimeout(()=>cb(pats()));return()=>{L.pl=L.pl.filter(x=>x!==cb)}},
    watchCfg(cb){L.cfg.push(cb);setTimeout(()=>cb(docs['config/main']||null));return()=>{}},
    saveCfg(c){set('config/main',c)},
    watchPatient(pid,cb){(L.pw[pid]=L.pw[pid]||[]).push(cb);setTimeout(()=>cb(pdata(pid)));return()=>{L.pw[pid]=L.pw[pid].filter(x=>x!==cb)}},
    saveInfo(pid,info){set('patients/'+pid,info)},
    saveObs(pid,k,o){set(`patients/${pid}/obs/t${ok(k)}`,o)},delObs(pid,k){del(`patients/${pid}/obs/t${ok(k)}`)},
    saveLab(pid,k,o){set(`patients/${pid}/labs/x${ok(k)}`,o)},delLab(pid,k){del(`patients/${pid}/labs/x${ok(k)}`)},
    saveOrder(pid,id,o){set(`patients/${pid}/orders/${id}`,o)},delOrder(pid,id){del(`patients/${pid}/orders/${id}`)},
    async delPatient(pid){for(const p of Object.keys(docs))if(p===('patients/'+pid)||p.startsWith('patients/'+pid+'/'))del(p);L.pl.forEach(f=>f(pats()))},
    async importPatient(pid,p){set('patients/'+pid,p.info);for(const[k,o]of Object.entries(p.obs||{}))set(`patients/${pid}/obs/t${ok(k)}`,o);
      for(const[k,o]of Object.entries(p.labs||{}))set(`patients/${pid}/labs/x${ok(k)}`,o);for(const[id,o]of Object.entries(p.orders||{}))set(`patients/${pid}/orders/${id}`,o);L.pl.forEach(f=>f(pats()))}
  };return st;
}

/* debounce ghi theo khoá */
const deb={};
function later(key,fn,ms=700){clearTimeout(deb[key]);pendingKeys.add(key);deb[key]=setTimeout(()=>{pendingKeys.delete(key);fn();flashSaved()},ms)}
const pendingKeys=new Set();
function flashSaved(){const el=document.getElementById('savedNote');if(el){el.textContent='Đã lưu '+hhmm(toKey(new Date()))}}
function setSync(cls,txt){const el=$('#sync');el.className='sync '+cls;el.querySelector('span').textContent=txt}

/* ============ LỊCH THEO DÕI ============ */
function arrivalDate(info){const d=info&&info.veHoiSuc?fromKey(info.veHoiSuc):null;return d&&!isNaN(d)?d:null}
function opDay(info){const s=info.ngayPT||(info.veHoiSuc||'').slice(0,10);return s?new Date(s+'T00:00'):null}
function dayN(k,info){const o=opDay(info);if(!o)return 0;const d=fromKey(k);const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.round((m-o)/864e5)}
/* lịch theo dõi theo từng ngày: plan = [khoảng giờ ngày 1, ngày 2, …], planRest = các ngày sau */
const INTS=[1,2,3,4,6,8,12];
function getPlan(o){o=o||{};if(Array.isArray(o.plan)&&o.plan.length)return {days:o.plan.map(x=>Math.max(1,+x||1)),rest:Math.max(1,+o.planRest||3)};
  const H=+o.hourlyHours||24;return {days:Array(Math.max(1,Math.ceil(H/24))).fill(1),rest:Math.max(1,+o.interval||3)}}
function intervalAt(info,d){const P=getPlan(info);return d<P.days.length?P.days[d]:P.rest}
function startHour(info){const a=arrivalDate(info);if(!a)return null;const s=new Date(a);if(s.getMinutes()||s.getSeconds()){s.setMinutes(0,0,0);s.setHours(s.getHours()+1)}return s}
function hourly(info){const P=getPlan(info);let n=0;while(n<P.days.length&&P.days[n]===1)n++;return n*24}
function slotOK(t,h,info){const d=Math.floor(h/24);const fit=I=>I===1||t.getHours()%I===0;if(fit(intervalAt(info,d)))return true;return h>0&&h%24===0&&fit(intervalAt(info,d-1))}
function schedule(info,obs){
  const set=new Set(Object.keys(obs||{}));const s=startHour(info);
  if(s){
    const now=new Date();const curD=Math.max(0,Math.floor((now-s)/864e5));
    let end=new Date(Math.max(now.getTime()+intervalAt(info,curD)*36e5,s.getTime()));
    if(info.trangThai&&info.trangThai!=='dang'){const ks=Object.keys(obs||{}).sort();end=ks.length?fromKey(ks[ks.length-1]):new Date(s.getTime()+24*36e5)}
    const cap=s.getTime()+21*864e5;if(end>cap)end=new Date(cap);
    for(let h=0;;h++){const t=new Date(s.getTime()+h*36e5);if(t>end)break;if(h===0||slotOK(t,h,info))set.add(toKey(t))}
  }
  Object.values(obs||{}).forEach(o=>{if(o&&o.slot&&o.slot!==o.k&&hasData(o)&&!hasData((obs||{})[o.slot]))set.delete(o.slot)});
  return [...set].sort();
}
function isScheduled(k,info){const s=startHour(info);if(!s)return false;const t=fromKey(k);if(t.getMinutes())return false;const h=Math.round((t-s)/36e5);if(h<0)return false;return h===0||slotOK(t,h,info)}
function hasData(o){return !!o&&(OBS_FIELDS.some(f=>has(o[f]))||Object.keys(o).some(x=>x.startsWith('x_')&&has(o[x])))}
function status(k,o){if(hasData(o))return 'done';const t=fromKey(k),now=new Date();if(t>now)return 'up';if(now-t<=30*6e4)return 'due';return 'late'}
function phaseText(info){const a=arrivalDate(info);if(!a)return null;const h=(Date.now()-a)/36e5;
  if(info.trangThai&&info.trangThai!=='dang')return {t:info.trangThai==='chuyen'?'Đã chuyển khoa':'Đã ra viện',slow:true};
  if(h<0)return {t:'Chưa về hồi sức',slow:false};
  const d=Math.floor(h/24),I=intervalAt(info,d);
  return I===1?{t:`Ngày ${d+1} · giờ thứ ${Math.floor(h)+1} · theo dõi mỗi giờ`,slow:false}:{t:`Ngày ${d+1} · theo dõi mỗi ${I} giờ`,slow:true}}
function planHtml(scope){
  const P=getPlan(scope==='cfg'?S.cfg:S.info);const opt=v=>INTS.map(x=>`<option value="${x}" ${x===v?'selected':''}>Mỗi ${x} giờ</option>`).join('');
  const rows=P.days.map((I,i)=>`<tr><td><b>Ngày ${i+1}</b></td><td class="num">${i*24}–${(i+1)*24} giờ</td><td><select class="inp" data-plan="${scope}" data-day="${i}" id="pl_${scope}_${i}">${opt(I)}</select></td><td class="num">${24/I} mốc</td></tr>`).join('');
  const n=P.days.length;
  return `<div class="scroll" style="max-width:640px"><table class="th"><tr><th>Ngày theo dõi</th><th>Tính từ giờ về HS</th><th>Ghi số liệu</th><th>Số mốc/ngày</th></tr>${rows}
    <tr><td><b>Từ ngày ${n+1} trở đi</b></td><td class="num">sau ${n*24} giờ</td><td><select class="inp" data-plan="${scope}" data-day="rest" id="pl_${scope}_rest">${opt(P.rest)}</select></td><td class="num">${24/P.rest} mốc</td></tr></table></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center" ${S.ro?'hidden':''}>
     <button class="btn sm" data-act="planadd" data-scope="${scope}">+ Thêm ngày</button>${n>1?`<button class="btn sm" data-act="planrem" data-scope="${scope}">− Bớt ngày cuối</button>`:''}
     <span class="hint" style="margin-left:6px">Mẫu nhanh:</span>

/* ============ CẢNH BÁO ============ */
function weightOf(info,obs,k){const ks=Object.keys(obs).filter(x=>x<=k&&has(obs[x].cannang)).sort();const w=ks.length?num(obs[ks[ks.length-1]].cannang):num(info.canNang);return isNaN(w)?null:w}
function lvl(x,t){if(isNaN(x)||!t)return null;if(t.cl!=null&&x<t.cl)return 'crit';if(t.ch!=null&&x>t.ch)return 'crit';if(t.wl!=null&&x<t.wl)return 'warn';if(t.wh!=null&&x>t.wh)return 'warn';return null}
function flagsOf(o,k){
  const th=S.cfg.th||TH_DEF,out={},msgs=[];if(!o)return {f:out,m:msgs};
  const add=(f,l,msg)=>{if(!l)return;out[f]=l;msgs.push({l,msg})};
  add('spo2',lvl(num(o.spo2),th.spo2),`SpO₂ ${o.spo2}%`);
  add('nt',lvl(num(o.nt),th.nt),`Nhịp thở ${o.nt} l/ph`);
  add('m',lvl(num(o.m),th.m),`Mạch ${o.m} l/ph`);
  add('hatt',lvl(num(o.hatt),th.hatt),`HA tâm thu ${o.hatt} mmHg`);
  add('t',lvl(num(o.t),th.t),`Nhiệt độ ${o.t} °C`);
  const w=weightOf(S.info||{},S.obs,k);const u=num(o.nuoctieu);
  if(!isNaN(u)){const r=u/(w||60);const l=lvl(r,th.nuoctieu);add('nuoctieu',l,`Nước tiểu ${o.nuoctieu} ml/giờ (${fmtN(r)} ml/kg/giờ${w?'':', ước 60 kg'})`)}
  add('danluu',lvl(num(o.danluu),th.danluu),`Dẫn lưu ${o.danluu} ml/giờ${o.tinhchat?' – '+o.tinhchat:''}`);
  add('dh',lvl(num(o.dh),th.dh),`Đường huyết ${o.dh} mmol/L`);
  msgs.sort((a,b)=>a.l===b.l?0:a.l==='crit'?-1:1);
  return {f:out,m:msgs};
}
function bilan(o){const a=num(o&&o.vao),b=num(o&&o.ra);return isNaN(a)&&isNaN(b)?NaN:(isNaN(a)?0:a)-(isNaN(b)?0:b)}
function labFlag(a,v){if(a.text)return null;const x=num(v);if(isNaN(x))return null;if(a.lo!=null&&x<a.lo)return 'lo';if(a.hi!=null&&x>a.hi)return 'hi';return null}

/* ============ TAB THEO DÕI ============ */
function spark(label,unit,vals,dec){
  const pts=vals.filter(v=>!isNaN(v.y));const last=pts[pts.length-1];
  if(pts.length<2)return `<div class="spark"><small><span>${label}</span><span>${unit}</span></small><b class="num">${last?fmtN(last.y):'—'}</b><svg viewBox="0 0 160 38"></svg></div>`;
  const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi===lo){hi+=1;lo-=1}
  const X=i=>4+i*(152/(pts.length-1)),Y=y=>34-(y-lo)/(hi-lo)*30;
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=d+`L${X(pts.length-1).toFixed(1)},36L4,36Z`;
  return `<div class="spark"><small><span>${label}</span><span>${unit}</span></small><b class="num">${fmtN(last.y)}</b>
   <svg viewBox="0 0 160 38" preserveAspectRatio="none"><path d="${area}" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${X(pts.length-1)}" cy="${Y(last.y)}" r="2.6" fill="var(--accent)"/></svg>
   <small><span class="num">${fmtN(lo)}–${fmtN(hi)}</span><span>${pts.length} mốc</span></small></div>`;
}
function obsTabHtml(){
  const p=S.info;if(!arrivalDate(p))return `<div class="banner info">Nhập <b>giờ về hồi sức</b> ở tab “Thông tin bệnh nhân” để ứng dụng lập lịch theo dõi.</div><div style="margin-top:10px"><button class="btn pri" data-tab="thongtin">Nhập thông tin</button></div>`;
  const keys=schedule(p,S.obs);const filled=keys.filter(k=>hasData(S.obs[k]));
  let cum=0;const cumS=filled.map(k=>{const b=bilan(S.obs[k]);if(!isNaN(b))cum+=b;return {y:cum}});
  const ser=f=>filled.map(k=>({y:num(S.obs[k][f])}));
  const trends=`<div class="trends">${spark('Mạch','l/ph',ser('m'))}${spark('HA tâm thu','mmHg',ser('hatt'))}${spark('SpO₂','%',ser('spo2'))}${spark('Nước tiểu','ml/giờ',ser('nuoctieu'))}${spark('Dẫn lưu','ml/giờ',ser('danluu'))}${spark('Bilan cộng dồn','ml',cumS)}</div>`;
  if(!S.sel||!keys.includes(S.sel)){S.sel=keys.find(k=>status(k,S.obs[k])==='due')||filled[filled.length-1]||[...keys].reverse().find(k=>status(k,S.obs[k])==='late')||keys[0]}
  if(S.ro&&!S.obsView)S.obsView='table';
  const sw=`<div class="vsw"><button class="${S.obsView!=='table'?'on':''}" data-act="vform">Phiếu nhập từng mốc</button><button class="${S.obsView==='table'?'on':''}" data-act="vtable">Bảng diễn biến (${filled.length} mốc)</button></div>`;
  if(S.obsView==='table')return trends+sw+obsTableHtml(filled);
  return trends+sw+`<div class="obs"><div style="min-width:0">${timelineHtml(keys)}</div><div style="min-width:0" id="formBox">${formHtml(S.sel)}</div></div>`;
}
function obsTableHtml(filled){
  if(!filled.length)return '<div class="banner info">Chưa có mốc nào có số liệu.</div>';

  let h=`<p class="hint" style="margin:0 0 8px">Mốc mới nhất bên trái. Bấm vào giờ ở tiêu đề cột để mở phiếu nhập của mốc đó.</p><div class="scroll"><table class="lab dtab"><tr><th>Thông số</th>${ks.map(k=>`<th><button class="x2" data-act="opennk" data-k="${k}">N${dayN(k,p)}<br>${hLabel(k)}</button>${S.obs[k].by?`<br><small>${esc(S.obs[k].by)}</small>`:''}</th>`).join('')}</tr>`;

function timelineHtml(keys){

    const vis=ks.filter(k=>!shw||(shw==='da'?hasData(S.obs[k]):!hasData(S.obs[k])&&status(k,S.obs[k])!=='up'));
    html+=vis.length?vis.map(k=>rowHtml(k)).join(''):`<div class="hint" style="padding:8px 12px">${shw==='chua'?'Ngày này đã nhập đủ các mốc.':'Chưa có mốc nào đã nhập.'}</div>`;
  }
  return html+'</div>';

function dsumTxt(done,ks){const miss=ks.filter(k=>!hasData(S.obs[k])&&status(k,S.obs[k])!=='up').length;return `đã nhập ${done}/${ks.length}`+(miss?` · chưa nhập ${miss}`:'')}
function rowHtml(k){

    :({up:'Sắp tới',due:'Đến giờ ghi',late:'Chưa nhập'}[st]);

function chipParts(v,opts){if(!has(v))return [];v=String(v);if(opts.includes(v))return [v];return v.split(/\s*;\s*/).map(x=>x.trim()).filter(Boolean)}

function raFields(){return ['nuoctieu','danluu',...extraFields().filter(f=>f.ra).map(f=>'x_'+f.k)]}
function autoRa(o){const fs=raFields();if(!fs.some(f=>has(o[f])))return '';return String(Math.round(fs.reduce((t,f)=>t+(num(o[f])||0),0)*10)/10)}
function filledKeys(){return Object.keys(S.obs).filter(k=>hasData(S.obs[k])).sort()}
function sumFluid(keys){let vao=0,ra=0,n=0;keys.forEach(k=>{const o=S.obs[k];const a=num(o.vao),b=num(o.ra);if(!isNaN(a)){vao+=a;n++}if(!isNaN(b)){ra+=b;n++}});return {vao,ra,bil:vao-ra,n}}
function cumAt(k){return sumFluid(filledKeys().filter(x=>x<=k))}
function dayFluid(n){return sumFluid(filledKeys().filter(x=>dayN(x,S.info)===n))}
function fluidHtml(k){const n=dayN(k,S.info),D=dayFluid(n),C=cumAt(k);const ml=x=>fmtN(x)+' ml';
  return `<div class="ftot"><div><small>Ngày N${n} (${dmy(k.slice(0,10)).slice(0,5)})</small><span>Vào <b class="num">${ml(D.vao)}</b></span><span>Ra <b class="num">${ml(D.ra)}</b></span><span>Bilan <b class="num ${D.bil<0?'neg':'pos'}">${signed(D.bil)} ml</b></span></div>
   <div><small>Cộng dồn đến ${hLabel(k)}</small><span>Vào <b class="num">${ml(C.vao)}</b></span><span>Ra <b class="num">${ml(C.ra)}</b></span><span>Bilan <b class="num ${C.bil<0?'neg':'pos'}">${signed(C.bil)} ml</b></span></div></div>`}
function stampObs(o,prev){if(!hasData(prev)){o.by=actorName();o.byId=actorId();delete o.suaBoi}else if(o.byId&&actorId()&&o.byId!==actorId())o.suaBoi=actorName();else if(!o.by)o.by=actorName()}
function updateObsField(k,f,v){
  const prev=S.obs[k];if(hasData(prev)&&!canEditRec(prev.byId)){toast('Mốc này do '+(prev.by||'người khác')+' ghi – chỉ người ghi hoặc Quản trị được sửa');return}
  const o={...(S.obs[k]||{}),k};if(v===''||v==null)delete o[f];else o[f]=v;
  if(f==='ra'){if(v===''||v==null)delete o.raTay;else o.raTay=true}
  if(f==='ra'&&!o.raTay||raFields().includes(f)&&!o.raTay){const a=autoRa(o);if(a==='')delete o.ra;else o.ra=a;const ri=document.querySelector('#o_ra');if(ri&&document.activeElement!==ri)ri.value=o.ra||''}
  stampObs(o,prev);o.at=Date.now();S.obs[k]=o;
  const pid=S.cur;later('obs'+pid+k,()=>store.saveObs(pid,k,S.obs[k]||{k}));
  refreshFormBits(k);
}

function suggestIssues(){
  const ks=Object.keys(S.obs).filter(k=>hasData(S.obs[k])).sort();const out=[];
  const recent=ks.slice(-6);const seen=new Set();
  recent.forEach(k=>flagsOf(S.obs[k],k).m.forEach(x=>{const key=x.msg.split(' ')[0]+x.msg.split(' ')[1];if(!seen.has(key)){seen.add(key);out.push(`${x.msg} lúc ${hLabel(k)}`)}}));
  const lk=Object.keys(S.labs).sort();const last=lk[lk.length-1];
  if(last)ANALYTES.forEach(a=>{const v=(S.labs[last].v||{})[a.k];const f=labFlag(a,v);if(f)out.push(`${a.l.split(' (')[0]} ${f==='hi'?'tăng':'giảm'} (${v}) – XN ${hLabel(last)}`)});
  let cum=0;ks.forEach(k=>{const b=bilan(S.obs[k]);if(!isNaN(b))cum+=b});if(ks.length&&Math.abs(cum)>1500)out.push(`Bilan cộng dồn ${signed(cum)} ml`);
  return out;
}

const FREQ={once:'Thực hiện 1 lần',d1:'1 lần/ngày',d2:'2 lần/ngày',d3:'3 lần/ngày',every:'Mỗi N giờ'};

function orderSlots(o){
  const set=new Set(Object.keys(o.reports||{}));const s=fromKey(o.batDau||'');if(isNaN(s))return [...set].sort();
  if(o.freq==='once'){set.add(o.batDau);return [...set].sort()}
  const now=new Date();let end=o.ketThuc?fromKey(o.ketThuc):new Date(now.getTime()+24*36e5);
  if(o.trangThai==='xong'&&o.xongLuc){const x=new Date(o.xongLuc);if(x<end)end=x}

function buildModel(){
  const p=S.info,o=S.rep;const all=schedule(p,S.obs).filter(k=>hasData(S.obs[k])||(!o.only&&fromKey(k)<=new Date()));
  const a=arrivalDate(p);const H=hourly(p);
  let keys=all.filter(k=>{const n=dayN(k,p);if(o.from!==''&&n<+o.from)return false;if(o.to!==''&&n>+o.to)return false;return true});
  if(o.step>1&&a)keys=keys.filter(k=>{const h=(fromKey(k)-a)/36e5;if(h>H||!isScheduled(k,p))return true;return Math.round(h)%o.step===0||Math.round(h)===0});
  // nhóm: 24 giờ đầu, sau đó theo ngày Nx
  const groups=[];const push=(t,k)=>{let g=groups[groups.length-1];if(!g||g.t!==t){g={t,keys:[]};groups.push(g)}g.keys.push(k)};
  keys.forEach(k=>{const h=a?(fromKey(k)-a)/36e5:0;if(a&&H>0&&h<=H)push(H===24?'NGÀY ĐẦU (24 GIỜ ĐẦU SAU MỔ)':`${H} GIỜ ĐẦU SAU MỔ`,k);else{const n=dayN(k,p);push(`HẬU PHẪU NGÀY ${n} (N${n}) – ${dmy(k.slice(0,10))}`,k)}});
  groups.forEach(g=>{g.chunks=[];for(let i=0;i<g.keys.length;i+=6)g.chunks.push(g.keys.slice(i,i+6))});
  const gl=k=>{const h=a?(fromKey(k)-a)/36e5:0;if(a&&H>0&&h<=H)return H===24?'NGÀY ĐẦU (24 GIỜ ĐẦU SAU MỔ)':`${H} GIỜ ĐẦU SAU MỔ`;const n=dayN(k,p);return `HẬU PHẪU NGÀY ${n} (N${n}) – ${dmy(k.slice(0,10))}`};
  groups.forEach(g=>{const ks=filledKeys().filter(k=>gl(k)===g.t);g.tot=sumFluid(ks);g.cum=ks.length?cumAt(ks[ks.length-1]).bil:0;
    g.totText=g.tot.n?`Tổng ${/GIỜ ĐẦU/.test(g.t)?(H+' giờ đầu'):'từ '+hLabel(ks[0])+' đến '+hLabel(ks[ks.length-1])}: dịch vào ${fmtN(g.tot.vao)} ml · dịch ra ${fmtN(g.tot.ra)} ml · bilan ${signed(g.tot.bil)} ml · bilan cộng dồn ${signed(g.cum)} ml`:''});
  const labKeys=Object.keys(S.labs).sort();const labChunks=[];for(let i=0;i<labKeys.length;i+=8)labChunks.push(labKeys.slice(i,i+8));
  const lastK=keys.filter(k=>hasData(S.obs[k])).pop();
  const issues=String(p.vanDe||'').split('\n').map(s=>s.replace(/^[-•\s]+/,'').trim()).filter(Boolean);
  return {groups,labChunks,lastK,issues};
}

async function saveFile(filename,data){
  const dl=await capDownloads;

  const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
  const mime=filename.endsWith('.docx')?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':filename.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':filename.endsWith('.json')?'application/json':filename.endsWith('.pdf')?'application/pdf':'application/octet-stream';
  const inApp=/Zalo|FBAN|FBAV|FB_IAB|Instagram|Line\/|Messenger|MicroMessenger/i.test(navigator.userAgent);
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
  const anchor=()=>{try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){toast('Không lưu được file')}};
  let file=null;try{file=new File([blob],filename,{type:mime})}catch(e){}
  const canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
  if(!mobile&&!inApp){anchor();return}
  const link=location.origin+location.pathname;
  modal(`<h3>File đã sẵn sàng</h3><p style="margin:0"><b>${esc(filename)}</b></p>
   ${inApp?`<div class="banner warn">Anh/chị đang mở trong <b>Zalo/Facebook</b> – ứng dụng này thường <b>chặn tải file</b>. Cách chắc chắn: bấm dấu <b>•••</b> (góc trên phải) → <b>Mở bằng trình duyệt</b> (Safari/Chrome), rồi bấm Xuất lại.</div>
     <button class="btn" data-m="cp">Sao chép link để mở bằng Safari/Chrome</button>`:''}
   ${canShare?'<p class="hint" style="margin:0">Bấm <b>Lưu / Mở file</b> → chọn <b>Lưu vào Tệp</b>, <b>Word</b>, hoặc gửi qua Zalo.</p>':''}
   <div class="acts"><button class="btn" data-m="cancel">Đóng</button>${canShare?'':'<button class="btn" data-m="dl">Tải xuống</button>'}<button class="btn pri" data-m="ok" ${canShare?'':'hidden'}>Lưu / Mở file</button></div>`,async()=>{
    try{await navigator.share({files:[file],title:filename});toast('Đã chia sẻ / lưu file')}catch(e){if(e&&e.name==='AbortError')return;anchor()}});
  const d=document.querySelector('[data-m="dl"]');if(d)d.onclick=()=>{anchor()};
  const c=document.querySelector('[data-m="cp"]');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Đã sao chép link – dán vào Safari/Chrome')}catch(e){prompt('Sao chép link này:',link)}};
}

function openPatient(pid){
  if(unwatch)unwatch();S.cur=pid;S.info=S.patients[pid]?{...S.patients[pid]}:null;S.obs={};S.labs={};S.orders={};S.sel=null;
  if(S.tab==='caidat')S.tab='theodoi';
  lsSet('hpt-cur',pid);renderList();renderMain();
  unwatch=store.watchPatient(pid,d=>{
    if(pid!==S.cur)return;
    if(!d||!d.info){if(S.info&&!pendingKeys.size){} return}
    let changed=false;
    if(!pendingKeys.has('info'+pid)&&JSON.stringify(d.info)!==JSON.stringify(S.info)){S.info=d.info;changed='info'}
    for(const[k,o]of Object.entries(d.obs)){if(pendingKeys.has('obs'+pid+k))continue;if(JSON.stringify(o)!==JSON.stringify(S.obs[k])){S.obs[k]=o;changed=changed||'obs'}}
    for(const k of Object.keys(S.obs)){if(!d.obs[k]&&!pendingKeys.has('obs'+pid+k)&&S.obs[k]&&S.obs[k].at&&Date.now()-S.obs[k].at>5000){delete S.obs[k];changed='obs'}}
    for(const[k,o]of Object.entries(d.labs)){if(pendingKeys.has('lab'+pid+k))continue;if(JSON.stringify(o)!==JSON.stringify(S.labs[k])){S.labs[k]=o;changed=changed||'lab'}}
    for(const k of Object.keys(S.labs)){if(!d.labs[k]&&!pendingKeys.has('lab'+pid+k)&&!(S.labs[k]&&S.labs[k].fresh)){delete S.labs[k];changed='lab'}}
    const dor=d.orders||{};
    for(const[id,o]of Object.entries(dor)){if(pendingKeys.has('ord'+pid+id))continue;if(JSON.stringify(o)!==JSON.stringify(S.orders[id])){S.orders[id]=o;changed=changed||'ord'}}
    for(const id of Object.keys(S.orders)){if(!dor[id]&&!pendingKeys.has('ord'+pid+id)&&!(S.orders[id]&&Date.now()-(S.orders[id].taoLuc||0)<8000)){delete S.orders[id];changed='ord'}}
    if(!changed)return;
    const act=document.activeElement;const editing=act&&act.closest&&act.closest('#tabBody')&&/INPUT|TEXTAREA|SELECT/.test(act.tagName);
    if(editing){if(S.tab==='theodoi'){document.querySelectorAll('.tl-row').forEach(r=>{const t=document.createElement('div');t.innerHTML=rowHtml(r.dataset.k);r.replaceWith(t.firstChild)})}return}
    renderMain();
  });
}

function mergeInto(d){const pid=S.cur;let nO=0,nL=0,nC=0;
  for(const[k,o]of Object.entries(d.obs||{})){if(!hasData(o))continue;if(hasData(S.obs[k]))continue;S.obs[k]=o;store.saveObs(pid,k,o);nO++}
  for(const[k,o]of Object.entries(d.labs||{})){if(S.labs[k]&&Object.keys(S.labs[k].v||{}).length)continue;S.labs[k]=o;store.saveLab(pid,k,o);nL++}
  for(const[id,o]of Object.entries(d.orders||{})){if(S.orders[id])continue;S.orders[id]=o;store.saveOrder(pid,id,o);nC++}
  const inf={...S.info};let nI=0;for(const[f,v]of Object.entries(d.info||{})){if(['taoLuc','hoTen'].includes(f))continue;if(!has(inf[f])&&has(v)){inf[f]=v;nI++}}
  if(d.info&&d.info.labNotes){inf.labNotes={...(d.info.labNotes||{}),...(S.info.labNotes||{})}}
  S.info=inf;S.patients[pid]=inf;store.saveInfo(pid,inf);renderAll();
  toast(`Đã gộp: ${nO} mốc theo dõi, ${nL} mốc xét nghiệm${nC?', '+nC+' chỉ định':''}${nI?', '+nI+' trường thông tin':''}. Mốc đã có số liệu được giữ nguyên.`)}

     <div class="acts"><button class="btn" data-m="cancel">Huỷ</button><button class="btn" data-m="new">Tạo hồ sơ mới</button><button class="btn pri" data-m="ok">Gộp vào hồ sơ này</button></div>`,()=>{mergeInto(d)});

  if(act==='dellab'){const k=t.dataset.k;if(!canEditRec((S.labs[k]||{}).byId)){toast('Chỉ người tạo mốc hoặc Quản trị được xoá');return}modal(`<h3>Xoá mốc xét nghiệm ${hLabel(k)}?</h3><div class="acts"><button class="btn" data-m="cancel">Giữ lại</button><button class="btn pri" data-m="ok">Xoá</button></div>`,()=>{

  if(act==='suggest'){const s=suggestIssues();if(!s.length){toast('Không thấy chỉ số bất thường gần đây');return}
    const cur=String(S.info.vanDe||'').trim();setInfo('vanDe',(cur?cur+'\n':'')+s.map(x=>'- '+x).join('\n'));const ta=$('#i_vanDe');if(ta)ta.value=S.info.vanDe;toast('Đã thêm '+s.length+' gợi ý — chỉnh sửa lại cho sát thực tế');return}
  if(act==='delpt'){const name=S.info.hoTen||'';modal(`<h3>Xoá hồ sơ ${esc(name)}?</h3><p class="hint" style="margin:0">Toàn bộ số liệu theo dõi và xét nghiệm sẽ bị xoá vĩnh viễn cho cả kíp. Nên sao lưu trước.</p><div class="acts"><button class="btn" data-m="cancel">Giữ lại</button><button class="btn pri" data-m="ok">Xoá hồ sơ</button></div>`,async()=>{
      const pid=S.cur;if(unwatch)unwatch();unwatch=null;S.cur=null;S.info=null;delete S.patients[pid];renderList();renderMain();try{await store.delPatient(pid);toast('Đã xoá hồ sơ')}catch(e){toast('Xoá chưa hết, thử lại')}});return}
  if(act==='planadd'||act==='planrem'||act==='planpre'||act==='plancfg'){if(S.ro)return;const sc=t.dataset.scope||'info';const P=getPlan(sc==='cfg'?S.cfg:S.info);
    if(act==='planadd')P.days.push(P.rest);else if(act==='planrem'){if(P.days.length>1)P.days.pop()}
    else if(act==='planpre'){const [d,r]=t.dataset.p.split(';');P.days=d.split(',').map(Number);P.rest=+r}
    else{const C=getPlan(S.cfg);P.days=C.days.slice();P.rest=C.rest}
    savePlan(sc,P);toast('Đã cập nhật lịch theo dõi');return}
  if(act==='resetth'){S.cfg.th=JSON.parse(JSON.stringify(TH_DEF));store.saveCfg(S.cfg);renderTab();toast('Đã khôi phục ngưỡng mặc định');return}
});
function setInfo(f,v){S.info={...S.info,[f]:v};const pid=S.cur;S.patients[pid]=S.info;S.infoDirty=1;infoSt('Có thay đổi – đang lưu…');later('info'+pid,()=>{store.saveInfo(pid,S.info);S.infoDirty=0;infoSt('✓ Đã lưu lúc '+hhmm(toKey(new Date())))})}
function infoSt(t){const e=document.getElementById('infoSt');if(e)e.textContent=t}
function saveInfoNow(){if(S.ro||!S.cur)return;const a=document.activeElement;if(a&&a.blur)a.blur();const pid=S.cur;clearTimeout(deb['info'+pid]);pendingKeys.delete('info'+pid);store.saveInfo(pid,S.info);S.infoDirty=0;flashSaved();infoSt('✓ Đã lưu lúc '+hhmm(toKey(new Date())));toast('Đã lưu thông tin bệnh nhân');renderList()}
document.addEventListener('focusin',e=>{if(e.target&&e.target.id==='psearch')e.target.removeAttribute('readonly')});
setTimeout(()=>{const i=document.getElementById('psearch');if(i&&i.value&&!S.q){i.value=''}},1500);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='fb_name'){e.preventDefault();fbLogin()}});
document.addEventListener('input',e=>{
  const t=e.target;if(S.ro&&!t.closest('.rep-opts')&&t.id!=='meInp'&&t.id!=='psearch'&&!t.closest('.modal'))return;
  if(t.id==='psearch'){S.q=t.value;renderList();return}
  if(t.id==='meInp'){S.me=t.value.trim();lsSet('hpt-me',S.me);return}
  if(t.dataset.khacf&&S.sel){updateObsField(S.sel,t.dataset.khacf,chipCompose(t.closest('.chips')));return}
  if(t.dataset.f&&S.sel){updateObsField(S.sel,t.dataset.f,t.value.trim()?t.value:'');return}
  if(t.dataset.i){setInfo(t.dataset.i,t.value);if(t.dataset.i==='hoTen')renderList();return}
  if(t.dataset.lab){const k=t.dataset.lab,a=t.dataset.a;if(!canEditRec((S.labs[k]||{}).byId))return;const L={...(S.labs[k]||{k}),v:{...((S.labs[k]||{}).v||{})}};if(t.value.trim())L.v[a]=t.value;else delete L.v[a];delete L.fresh;S.labs[k]=L;
    const an=ANALYTES.find(x=>x.k===a);t.classList.remove('hi','lo');const fl=labFlag(an,t.value);if(fl)t.classList.add(fl);
    const pid=S.cur;later('lab'+pid+k,()=>store.saveLab(pid,k,{k,v:S.labs[k].v,byId:S.labs[k].byId||actorId(),by:S.labs[k].by||actorName()}));return}
  if(t.dataset.note){setInfo('labNotes',{...(S.info.labNotes||{}),[t.dataset.note]:t.value});return}
  if((t.dataset.cfg||t.dataset.th)&&!canAdmin())return;
  if(t.dataset.cfg){S.cfg={...S.cfg,[t.dataset.cfg]:t.value};later('cfg',()=>store.saveCfg(S.cfg));return}
  if(t.dataset.th){const th=JSON.parse(JSON.stringify(S.cfg.th||TH_DEF));const x=num(t.value);th[t.dataset.th]=th[t.dataset.th]||{};if(isNaN(x))delete th[t.dataset.th][t.dataset.x];else th[t.dataset.th][t.dataset.x]=x;S.cfg={...S.cfg,th};later('cfg',()=>store.saveCfg(S.cfg));return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('mau')&&t.dataset.to){const v=t.value;t.value='';const f=t.dataset.to,ta=$('#o_'+f);if(!v||!ta||ta.disabled||S.ro||!S.sel)return;const sep=f==='khac'?'; ':'. ';const cur=ta.value.replace(/[\s.;,]+$/,'');const nv=cur?cur+sep+v:v;ta.value=nv;updateObsField(S.sel,f,nv);return}
  if(t.id==='tlShow'){S.tlShow=t.value;renderTab();return}
  if(t.id==='tlDay'){S.tlDay=t.value===''?null:+t.value;renderTab();return}
  if(t.dataset.staff){if(!canAdmin())return;const id=t.dataset.staff,v=t.value;const st=staffList();
    if(v!=='admin'&&st.find(x=>x.id===id).role==='admin'&&st.filter(x=>x.role==='admin').length===1){toast('Phải còn ít nhất một Quản trị');t.value='admin';return}
    saveStaff(st.map(x=>x.id===id?{...x,role:v}:x));return}
  if(t.dataset.plan==='cfg'&&!canAdmin())return;
  if(t.dataset.plan){if(S.ro)return;const sc=t.dataset.plan;const P=getPlan(sc==='cfg'?S.cfg:S.info);if(t.dataset.day==='rest')P.rest=+t.value;else P.days[+t.dataset.day]=+t.value;savePlan(sc,P);return}
  const dw=t.closest&&t.closest('.dt[data-info]');
  if(dw){if(S.ro)return;const v=dtVal('i_'+dw.dataset.info);if(v){setInfo(dw.dataset.info,v);renderList();const sc=window.scrollY;renderMain();window.scrollTo(0,sc)}return}
  if(t.dataset.rep){S.rep[t.dataset.rep]=t.type==='checkbox'?t.checked:t.value;const pp=$('#paper');if(pp){pp.innerHTML=paperHtml();fitPaper()}return}
  if(t.dataset.i&&['veHoiSuc','hourlyHours','interval','trangThai','ngayPT'].includes(t.dataset.i)){setInfo(t.dataset.i,t.tagName==='SELECT'&&t.dataset.i!=='trangThai'?+t.value:t.value);renderList();
    const sc=window.scrollY;renderMain();window.scrollTo(0,sc)}
});

/* ============ KHỞI ĐỘNG ============ */
let _dl=null;const capDownloads={then(r,j){if(!_dl)_dl=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')).catch(()=>null):Promise.resolve(null);return _dl.then(r,j)}};
function start(st){
  store=st;S.mode=st.kind;
  setSync(st.kind==='local'?'local':'ok',st.kind==='db'?'Đồng bộ cho cả kíp':st.kind==='fb'?'Dữ liệu chung của khoa':st.kind==='sheet'?(st.ro?'Chỉ xem (dữ liệu chung)':'Dùng chung (Google Sheet)'):'Lưu trên máy này – bấm để kết nối');
  st.watchCfg(c=>{if(st.kind!=='db'&&!(c&&Array.isArray(c.staff)&&c.staff.length)){c={...(c||{}),staff:DEFAULT_STAFF};st.saveCfg({...S.cfg,...c})}
    if(c&&!pendingKeys.has('cfg')){S.cfg={...JSON.parse(JSON.stringify(CFG_DEF)),...c,th:{...TH_DEF,...(c.th||{})}};renderWho();if(S.tab==='caidat'&&!document.activeElement.closest('#main'))renderMain()}});
  startData();
}
let dataStarted=false;
function startData(){if(dataStarted)return;dataStarted=true;const st=store;
  let first=true;
  st.listPatients(m=>{
    for(const id of Object.keys(m)){if(id===S.cur&&pendingKeys.has('info'+id))m[id]=S.info}
    S.patients=m;renderList();
    if(first){first=false;const last=lsGet('hpt-cur',null);const ids=Object.keys(m);
      const pick=last&&m[last]?last:ids.filter(i=>(m[i].trangThai||'dang')==='dang').sort((a,b)=>(m[b].veHoiSuc||'').localeCompare(m[a].veHoiSuc||''))[0];
      if(pick)openPatient(pick);else renderMain()}
    else if(S.cur&&!m[S.cur]){S.cur=null;S.info=null;renderMain()}
    else if(S.cur&&S.tab!=='thongtin'&&m[S.cur]&&!pendingKeys.has('info'+S.cur)&&JSON.stringify(m[S.cur])!==JSON.stringify(S.info)){S.info=m[S.cur];const act=document.activeElement;if(!(act&&act.closest&&act.closest('#tabBody')&&/INPUT|TEXTAREA/.test(act.tagName)))renderMain()}
  });
}
renderList();renderMain();
(async()=>{
  let db=null,user=null;
  if(window.claude&&window.claude.use){try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){db=null}}
  if(db){
    try{if(user&&user.can){const w=await user.can('data.write');if(w===false)S.shareRo=true}}catch(e){}
    try{S.isOwner=!!(user&&user.isOwner&&await user.isOwner())}catch(e){}
    start(makeDbStore(db));if(S.shareRo)setSync('local','Chỉ xem');
  }else{
    const h=location.hash||'';if(h.startsWith('#kn=')){try{const v=b64d(h.slice(4));if(v.u&&v.k){lsSet('hpt-sync',{u:v.u,k:v.k});lsSet('hpt-sheet-cache',null)}}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
    let fbdb=null;try{fbdb=await fbConnect()}catch(e){console.warn('Firebase',e)}
    if(fbdb){S.mode='fb';start(makeFbStore(fbdb));renderWho();return}
    const sy=syncConf();
    if(sy){const ss=makeSheetStore(sy.u,sy.k);try{await ss.init();if(ss.ro)S.shareRo=true;start(ss)}catch(e){const c=lsGet('hpt-sheet-cache',null);
      if(c&&c.docs){start(ss);setSync('err','Mất kết nối – đang xem bản lưu gần nhất')}else{start(makeLocalStore());setSync('err',(e&&e.message)||'Không kết nối được Google Sheet')}}}
    else start(makeLocalStore());
  }
})();
setInterval(()=>{if(S.cur&&S.tab==='theodoi'){const act=document.activeElement;if(act&&act.closest&&act.closest('#tabBody')&&/INPUT|TEXTAREA/.test(act.tagName))return;document.querySelectorAll('.tl-row').forEach(r=>{const t=document.createElement('div');t.innerHTML=rowHtml(r.dataset.k);r.replaceWith(t.firstChild)})}},60000);
</script>
